name: Update GitHub stats SVG

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 3am UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats SVG
        run: |
          mkdir -p assets
          curl -s "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&hide_title=true&hide_border=true&count_private=true&theme=dark" -o assets/stats.svg

      - name: Fetch top languages SVG
        run: |
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&hide_title=true&hide_border=true&theme=dark" -o assets/top-langs.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update stats svg" && git push)
